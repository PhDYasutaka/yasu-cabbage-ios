name: CabbageApp
options:
  bundleIdPrefix: yasu
  deploymentTarget:
    iOS: "18.4"

targets:
  CabbageApp:
    type: application
    platform: iOS
    deploymentTarget: "18.4"
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: きゃべつ
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        NSCameraUsageDescription: 課題提出用の写真を撮影するためにカメラを使用します。
        NSPhotoLibraryAddUsageDescription: ダウンロードした資料を写真に保存する際に使用します。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yasu.cabbage
        PRODUCT_NAME: CabbageApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
