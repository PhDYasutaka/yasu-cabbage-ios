name: CabbageApp
options:
  bundleIdPrefix: yasu
  deploymentTarget:
    iOS: "15.0"

targets:
  CabbageApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yasu.cabbage
        PRODUCT_NAME: CabbageApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
